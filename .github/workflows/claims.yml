name: claims

# Runs the receipts behind claims.json: every number in the READMEs must still be printed by the
# spike next to it. Each check runs scripts/setup.sh, which pins chenglou/handwired at 257856e.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  verify:
    name: published numbers still reproduce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - uses: alloevil/verify-claims@v0.1.1
