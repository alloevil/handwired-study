<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">handwired-study — is a hand-wired circuit exactly your JS?</title>
  <desc id="desc">Measured on seeded synthetic inputs: circuit reference vs compiled evaluator differ in 0 of 226,960 values; vs step-by-step FP32 JS written with roundAffine, 0 of 113,480; with plain affine, 2,246 of 113,480; vs float64 JS, 55,336 of 113,480. R2R EWMA test MSE 293.4 to 185.8 with circuit gradients.</desc>
  <rect width="1200" height="420" rx="18" fill="#0d1117"/>
  <g id="identity" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <text x="56" y="70" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="1">STUDY · chenglou/handwired @ 257856e</text>
    <text x="56" y="150" fill="#e6edf3" font-size="64" font-weight="700">handwired<tspan fill="#f0883e">-study</tspan></text>
    <text x="56" y="206" fill="#e6edf3" font-size="28">Is a hand-wired circuit</text>
    <text x="56" y="244" fill="#e6edf3" font-size="28">exactly your JS?</text>
    <text x="56" y="296" fill="#3fb950" font-size="24" font-weight="600">FP32-exact, yes.</text>
    <text x="56" y="330" fill="#8b949e" font-size="24" font-weight="600">float64-exact, no.</text>
    <text x="56" y="384" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">seeded synthetic inputs · Bun 1.4.2</text>
  </g>
  <g id="four-evaluators" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="600" y="70" fill="#8b949e" font-size="18" letter-spacing="1">CIRCUIT REFERENCE  vs  …   values that differ</text>
    <path d="M600 88H1144" stroke="#30363d" stroke-width="2"/>
    <g transform="translate(600 130)">
      <text x="0" y="0" fill="#e6edf3" font-size="22">compiled evaluator</text>
      <text x="544" y="0" fill="#3fb950" font-size="24" font-weight="700" text-anchor="end">0 / 226,960</text>
    </g>
    <g transform="translate(600 186)">
      <text x="0" y="0" fill="#e6edf3" font-size="22">fround JS, roundAffine</text>
      <text x="544" y="0" fill="#3fb950" font-size="24" font-weight="700" text-anchor="end">0 / 113,480</text>
    </g>
    <g transform="translate(600 242)">
      <text x="0" y="0" fill="#e6edf3" font-size="22">fround JS, affine</text>
      <text x="544" y="0" fill="#e3b341" font-size="24" font-weight="700" text-anchor="end">2,246 / 113,480</text>
    </g>
    <g transform="translate(600 298)">
      <text x="0" y="0" fill="#e6edf3" font-size="22">plain float64 JS</text>
      <text x="544" y="0" fill="#8b949e" font-size="24" font-weight="700" text-anchor="end">55,336 / 113,480</text>
    </g>
    <path d="M600 330H1144" stroke="#30363d" stroke-width="2"/>
    <text x="600" y="372" fill="#e6edf3" font-size="20">R2R EWMA test MSE  <tspan fill="#8b949e">293.4</tspan> → <tspan fill="#f0883e" font-weight="700">185.8</tspan></text>
    <text x="600" y="398" fill="#8b949e" font-size="18">tuned by the circuit's own gradients</text>
  </g>
</svg>
